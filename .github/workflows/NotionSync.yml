name: Notion Sync

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process new problems
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |

          set -e

          
          echo "===== RAW DIFF ====="
          git diff --name-status HEAD^ HEAD || true
          echo "===================="

          # ----------------------------
          # 1️⃣ 새로 추가된 README 감지
          # ----------------------------

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            FILES=$(git diff --name-status HEAD^ HEAD \
              | grep 'Algorithm/' \
              | grep 'README.md' \
              | awk '{print $2}')
          else
            FILES=$(git ls-files | grep 'Algorithm/' | grep 'README.md')
          fi

          echo "Detected files:"
          echo "$FILES"

          for FILE in $FILES; do

            DIR=$(dirname "$FILE")

            TITLE_LINE=$(grep -m 1 '^#' "$FILE")

            RAW_LEVEL=$(echo "$TITLE_LINE" | sed -n 's/.*\[level \([0-9]\+\)\].*/\1/ip')
            LEVEL="Lv.$RAW_LEVEL"

            NUMBER=$(echo "$TITLE_LINE" | sed -n 's/.*- \([0-9]\+\).*/\1/p')
            NAME=$(echo "$TITLE_LINE" | sed -n 's/.*] \(.*\) - [0-9]\+/\1/p')

            CATEGORY=$(echo "$DIR" | awk -F/ '{print $2}')

            CODE_FILE=$(ls "$DIR" | grep -E '\.(py|java|cpp|js|ts)$' | head -n 1)

            if [ -z "$CODE_FILE" ]; then
              echo "No code file found in $DIR"
              continue
            fi

            CODE_CONTENT=$(cat "$DIR/$CODE_FILE" | jq -Rs .)

            LINK="${{ github.server_url }}/${{ github.repository }}/blob/main/$DIR"

            NOW_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            echo "Creating Notion page for $NAME"

            # ----------------------------
            # 2️⃣ Notion 페이지 생성
            # ----------------------------
            curl -s -X POST https://api.notion.com/v1/pages \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Notion-Version: 2022-06-28" \
              -d "{
                \"parent\": {
                  \"database_id\": \"$NOTION_DATABASE_ID\"
                },
                \"properties\": {
                  \"이름\": {
                    \"title\": [
                      {\"text\": {\"content\": \"$NAME\"}}
                    ]
                  },
                  \"난이도\": {
                    \"select\": {\"name\": \"$LEVEL\"}
                  },
                  \"문제번호\": {
                    \"number\": $NUMBER
                  },
                  \"구분\": {
                    \"select\": {\"name\": \"$CATEGORY\"}
                  },
                  \"GitHub\": {
                    \"url\": \"$LINK\"
                  },
                  \"생성일시\": {
                    \"date\": {
                      \"start\": \"$NOW_DATE\"
                    }
                  }
                },
                \"children\": [
                  {
                    \"object\": \"block\",
                    \"type\": \"code\",
                    \"code\": {
                      \"language\": \"plain text\",
                      \"rich_text\": [
                        {
                          \"type\": \"text\",
                          \"text\": {\"content\": $CODE_CONTENT}
                        }
                      ]
                    }
                  }
                ]
              }"

          done
